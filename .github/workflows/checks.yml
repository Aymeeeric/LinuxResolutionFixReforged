# Runs on every push and pull request: luacheck on the addon's code.
# A red cross on a commit means it found a problem.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua-check >/dev/null

      - name: Static checks
        run: luacheck .
